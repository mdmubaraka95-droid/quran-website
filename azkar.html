<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Morning & Evening Azkar</title> <style> :root{ --green:#087f5b; --dark:#07563f; --gold:#d4a72c; --bg:#f5f8f6; --card:#ffffff; --text:#17231f; --muted:#718078; --border:#e2ebe6; } *{ box-sizing:border-box; margin:0; padding:0; } body{ font-family:Arial,sans-serif; background:var(--bg); color:var(--text); } body.dark{ --bg:#101816; --card:#18221f; --text:#f1f5f3; --muted:#aab8b2; --border:#2a3833; } header{ background:linear-gradient(135deg,var(--dark),var(--green)); color:white; padding:25px 15px; } .header{ max-width:900px; margin:auto; display:flex; align-items:center; gap:15px; } .back,.theme{ border:0; background:rgba(255,255,255,.15); color:white; padding:10px 15px; border-radius:8px; cursor:pointer; font-size:15px; } .header-title{ flex:1; text-align:center; } .header-title h1{ font-size:26px; } .header-title p{ margin-top:6px; } .main{ max-width:900px; margin:25px auto; padding:0 15px; } .tabs{ display:flex; justify-content:center; gap:10px; margin-bottom:25px; } .tab{ border:1px solid var(--border); background:var(--card); color:var(--text); padding:13px 25px; border-radius:10px; cursor:pointer; font-size:16px; } .tab.active{ background:var(--green); color:white; } .zikr-card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:25px; margin-bottom:20px; } .zikr-number{ color:var(--green); font-weight:bold; font-size:17px; margin-bottom:15px; } .arabic{ direction:rtl; text-align:right; font-family:"Traditional Arabic","Amiri","Times New Roman",serif; font-size:29px; line-height:2.1; margin-bottom:15px; } .english{ color:var(--muted); font-size:16px; line-height:1.6; margin-bottom:12px; } .target{ color:var(--green); font-weight:bold; margin-bottom:20px; } /* TALLY AREA */ .tally-area{ text-align:center; padding-top:10px; } .tally-count{ font-size:32px; font-weight:bold; color:var(--green); margin-bottom:12px; } .tally-button{ width:150px; height:150px; border-radius:50%; border:8px solid #cce9dd; background:var(--green); color:white; font-size:22px; font-weight:bold; cursor:pointer; box-shadow:0 6px 15px rgba(0,0,0,.18); transition:.1s; } .tally-button:active{ transform:scale(.94); } .tally-button.completed{ background:var(--gold); border-color:#f1d98b; } .counter-buttons{ margin-top:15px; display:flex; justify-content:center; gap:10px; } .counter-buttons button{ border:0; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:15px; color:white; } .minus{ background:#087f5b; } .reset{ background:#777; } @media(max-width:650px){ .header{ flex-wrap:wrap; } .header-title{ order:-1; flex-basis:100%; } .header-title h1{ font-size:22px; } .arabic{ font-size:24px; } .tabs{ flex-direction:column; } .tab{ width:100%; } .tally-button{ width:130px; height:130px; } } </style> </head> <body> <header> <div class="header"> <button class="back" onclick="goHome()"> ← Home </button> <div class="header-title"> <h1>📿 Morning & Evening Azkar</h1> <p>Remember Allah</p> </div> <button class="theme" onclick="toggleDarkMode()"> 🌙 </button> </div> </header> <main class="main"> <div class="tabs">

<button id="morningTab" class="tab active" onclick="showAzkar('morning')">
🌅 Morning Azkar
</button>

<button id="eveningTab" class="tab" onclick="showAzkar('evening')">
🌇 Evening Azkar
</button>

</div> <div id="azkarContainer"></div> </main> <script> const morningAzkar = [ { arabic:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", english:"Ayat al-Kursi", count:1 }, { arabic:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", english:"Surah Al-Ikhlas", count:3 }, { arabic:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", english:"Surah Al-Falaq", count:3 }, { arabic:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", english:"Surah An-Nas", count:3 }, { arabic:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا", english:"I am pleased with Allah as my Lord, Islam as my religion, and Muhammad ﷺ as my Prophet.", count:3 }, { arabic:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", english:"Glory and praise be to Allah.", count:100 }, { arabic:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", english:"There is no god but Allah alone, without partner.", count:10 } ]; const eveningAzkar = [ { arabic:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", english:"Ayat al-Kursi", count:1 }, { arabic:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", english:"Surah Al-Ikhlas", count:3 }, { arabic:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", english:"Surah Al-Falaq", count:3 }, { arabic:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", english:"Surah An-Nas", count:3 }, { arabic:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", english:"Evening remembrance", count:1 }, { arabic:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا", english:"I am pleased with Allah as my Lord, Islam as my religion, and Muhammad ﷺ as my Prophet.", count:3 }, { arabic:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", english:"Glory and praise be to Allah.", count:100 }, { arabic:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", english:"There is no god but Allah alone, without partner.", count:10 } ]; let currentType = "morning"; const counters = {}; function showAzkar(type){ currentType = type; const data = type === "morning" ? morningAzkar : eveningAzkar; document.getElementById("morningTab") .classList.toggle("active",type === "morning"); document.getElementById("eveningTab") .classList.toggle("active",type === "evening"); const container = document.getElementById("azkarContainer"); container.innerHTML = ""; data.forEach((zikr,index)=>{ const key = `${type}-${index}`; if(counters[key] === undefined){ counters[key] = 0; } const card = document.createElement("div"); card.className = "zikr-card"; card.innerHTML = ` <div class="zikr-number"> Zikr ${index + 1} </div> <div class="arabic"> ${zikr.arabic} </div> <div class="english"> ${zikr.english} </div> <div class="target"> Target: ${zikr.count} time(s) </div> <div class="tally-area"> <div id="tally-${type}-${index}" class="tally-count"> ${counters[key]} </div> <button id="button-${type}-${index}" class="tally-button" onclick="tally(${index})"> TALLY </button> <div class="counter-buttons"> <button class="minus" onclick="minus(${index})"> − 1 </button> <button class="reset" onclick="reset(${index})"> Reset </button> </div> </div> `; container.appendChild(card); }); } function tally(index){ const data = currentType === "morning" ? morningAzkar : eveningAzkar; const key = `${currentType}-${index}`; if(counters[key] < data[index].count){ counters[key]++; } updateTally(index); } function minus(index){ const key = `${currentType}-${index}`; if(counters[key] > 0){ counters[key]--; } updateTally(index); } function reset(index){ const key = `${currentType}-${index}`; counters[key] = 0; updateTally(index); } function updateTally(index){ const data = currentType === "morning" ? morningAzkar : eveningAzkar; const key = `${currentType}-${index}`; const count = document.getElementById( `tally-${currentType}-${index}` ); const button = document.getElementById( `button-${currentType}-${index}` ); count.textContent = counters[key]; if(counters[key] >= data[index].count){ button.classList.add("completed"); button.textContent = "✓ DONE"; }else{ button.classList.remove("completed"); button.textContent = "TALLY"; } } function goHome(){ window.location.href = "index.html"; } function toggleDarkMode(){ document.body.classList.toggle("dark"); localStorage.setItem( "darkMode", document.body.classList.contains("dark") ); } if(localStorage.getItem("darkMode") === "true"){ document.body.classList.add("dark"); } showAzkar("morning"); </script> </body> </html>
